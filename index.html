<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>💌 Cita de Halloween para mi Flaquita 💕</title>

<meta property="og:title" content="💌 Cita de Halloween para mi Flaquita 💕">
<meta property="og:description" content="Una sorpresa espeluznantemente dulce te espera... 🎃💖">
<meta property="og:image" content="https://cdn.pixabay.com/photo/2017/08/06/22/01/heart-2596111_1280.jpg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://TU_ENLACE.vercel.app/">

<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent: #ff6b35;
    --accent2: #b721ff;
    --text: #f1f1f1;
    --shadow-light: rgba(255, 255, 255, 0.07);
    --shadow-dark: rgba(0, 0, 0, 0.5);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', 'Poppins', sans-serif;
    background: linear-gradient(135deg, var(--bg), #0f0f1a);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100dvh;
    margin: 0;
    overflow-x: hidden;
    color: var(--text);
    padding: 20px 15px;
    position: relative;
  }

  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 10% 20%, rgba(183, 33, 255, 0.05) 0%, transparent 20%),
      radial-gradient(circle at 90% 80%, rgba(255, 107, 53, 0.05) 0%, transparent 20%);
    pointer-events: none;
    z-index: -1;
  }

  .card {
    background: var(--surface);
    border-radius: 24px;
    padding: 28px 20px;
    text-align: center;
    width: 100%;
    max-width: 500px;
    box-shadow: 
      0 10px 30px rgba(0, 0, 0, 0.5),
      inset 8px 8px 16px var(--shadow-dark),
      inset -8px -8px 16px var(--shadow-light);
    transition: transform 0.2s ease;
    position: relative;
    margin-top: 20px;
  }

  .card::after {
    content: "🎃";
    position: absolute;
    top: 12px;
    right: 18px;
    font-size: 22px;
    opacity: 0.3;
  }

  h1 {
    font-size: 1.7em;
    color: var(--accent);
    margin-bottom: 14px;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(255, 107, 53, 0.4);
  }

  p {
    font-size: 1.05em;
    color: #e0e0ff;
    margin-bottom: 12px;
    line-height: 1.5;
  }

  #botones {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 1.05em;
    border: none;
    border-radius: 16px;
    padding: 12px 24px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 700;
    outline: none;
    background: var(--surface);
    box-shadow: 
      inset 4px 4px 8px var(--shadow-dark),
      inset -4px -4px 8px var(--shadow-light);
    color: white;
    min-width: 120px;
  }

  button:active {
    box-shadow: 
      inset 2px 2px 4px var(--shadow-dark),
      inset -2px -2px 4px var(--shadow-light);
    transform: scale(0.97);
  }

  #si {
    background: linear-gradient(135deg, var(--accent), #ff8c42);
    color: white;
  }

  #no {
    background: linear-gradient(135deg, #4a4a6e, #2d2d44);
    color: #d0d0ff;
  }

  #mensajeFinal {
    display: none;
    margin-top: 24px;
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  #mensajeFinal.show {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  .mensaje-card {
    background: rgba(22, 33, 62, 0.7);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 
      0 8px 20px rgba(0, 0, 0, 0.4),
      inset 6px 6px 12px var(--shadow-dark),
      inset -6px -6px 12px var(--shadow-light);
    line-height: 1.5;
    backdrop-filter: blur(4px);
  }

  .mensaje-card p {
    margin: 7px 0;
    font-size: 1.15em;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(255, 107, 53, 0.3);
  }

  #inicio {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
    background: var(--bg);
    padding: 0 20px;
  }

  #inicio .card {
    animation: fadeIn 0.6s ease-out;
    margin: 0;
  }

  #contenido {
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    width: 100%;
    max-width: 500px;
  }

  canvas#confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none !important;
    z-index: 1;
  }

  /* Calabaza animada */
  #pumpkin {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 28px;
    animation: glowPumpkin 2s infinite alternate;
    z-index: 5;
    text-shadow: 0 0 12px var(--accent);
  }

  @keyframes glowPumpkin {
    from { opacity: 0.7; transform: scale(1); }
    to { opacity: 1; transform: scale(1.05); }
  }

  /* Murciélagos */
  .bat {
    position: fixed;
    bottom: -10px;
    font-size: 20px;
    animation: flyUp 8s linear infinite;
    opacity: 0.85;
    z-index: 5;
    text-shadow: 0 0 6px var(--accent2);
  }

  @keyframes flyUp {
    0% { transform: translateY(0) scale(1); opacity: 0.85; }
    100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .pumpkin {
    display: inline-block;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* Scroll suave al mensaje final */
  html {
    scroll-behavior: smooth;
  }
</style>
</head>
<body>
  <!-- Calabaza decorativa -->
  <div id="pumpkin">🎃</div>

  <!-- Pantalla inicial -->
  <div id="inicio">
    <div class="card">
      <h2>🦇 ¿Te atreves a empezar la sorpresa? 🎃</h2>
      <button id="empezar">¡Acepto el reto! 👻</button>
    </div>
  </div>

  <!-- Contenido principal -->
  <div id="contenido" class="card">
    <h1>💌 Cita de Halloween para mi Flaquita 💕</h1>
    <p>¿Quieres venir a una cita <span class="pumpkin">secreta y espeluznante</span> conmigo? 😈</p>
    <p id="subeVolumen">(Sube el volumen 🔊)</p>

    <div id="botones">
      <button id="si">Sí, ¡me encanta! 💀</button>
      <button id="no">No... 👻</button>
    </div>

    <div id="mensajeFinal">
      <div class="mensaje-card">
        <p>¡Sabía que dirías que sí! 💞</p>
        <p>Nos vemos en nuestra cita de Halloween ✨</p>
        <p>Te espero, Flaquita 💕 — no llegues tarde... o te atraparé 😉</p>
      </div>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <!-- Audios -->
  <audio id="musica" preload="auto" loop>
    <source src="whistling-ukulele-pop-playful-kids-background-422933.mp3" type="audio/mpeg">
  </audio>
  <!-- Sonido de murciélago (opcional) -->
  <audio id="murcielago" preload="auto">
    <source src="https://cdn.pixabay.com/audio/2022/03/17/audio_8a0d6a5e5f.mp3" type="audio/mpeg">
  </audio>

<script>
  const musica = document.getElementById('musica');
  const sonidoPop = new Audio('pop-94319.mp3');
  const sonidoMurcielago = document.getElementById('murcielago');
  sonidoPop.volume = 0.4;
  sonidoMurcielago.volume = 0.5;

  const inicio = document.getElementById('inicio');
  const contenido = document.getElementById('contenido');
  const botonEmpezar = document.getElementById('empezar');
  const botonNo = document.getElementById('no');
  const botonSi = document.getElementById('si');
  const mensajeFinal = document.getElementById('mensajeFinal');
  const contenedorBotones = document.getElementById('botones');

  botonEmpezar.addEventListener('click', playMusic);

  function playMusic() {
    inicio.style.display = 'none';
    contenido.style.display = 'block';
    setTimeout(() => contenido.style.opacity = 1, 100);
    musica.play().catch(err => {
      console.warn("No se pudo reproducir la música:", err);
      mostrarBotonAudio();
    });
    setInterval(crearMurcielago, 900);
  }

  function mostrarBotonAudio() {
    if (document.getElementById('btn-activar-audio')) return;
    const btn = document.createElement('button');
    btn.id = 'btn-activar-audio';
    btn.textContent = '🔊 Activa el sonido';
    btn.style.cssText = `
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      color: white;
      font-size: 1.05em;
      padding: 12px 22px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      z-index: 20;
      font-family: 'Poppins', sans-serif;
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    `;
    document.body.appendChild(btn);
    btn.addEventListener('click', () => {
      musica.play().then(() => btn.remove()).catch(console.error);
    });
  }

  const frasesNo = [
    "¿Segura? 😏","Piénsalo otra vez 💭","No puedes decirme que no 😜",
    "Vamosss, di que sí 💘","Me romperás el corazón 💔","Inténtalo de nuevo 😅",
    "No existe el 'no' en mi diccionario 😎","Dale al botón naranja mejor 🎃",
    "El 'no' no aplica aquí 😜","Vamos, sé mi cita de Halloween 💞","Te prometo risas y dulces 🍬",
    "No seas tímida 😌","Solo un 'sí' y serás la más feliz 💖","¿Y si te invito con calabazas? 🎃",
    "A que no puedes resistirte 😘","Tu 'no' suena como un 'sí' disimulado 😏",
    "Me estás haciendo sufrir 😭","Hazlo por mi corazóncito 💘","Te daré chocolates 🍫",
    "Vamos, no te hagas la difícil 😍","Por faaa 🥺","Diana, no me rompas el corazón 💔",
    "Te llevo serenata 🎸","Ya tengo los dulces listos 🍨"
  ];

  let contadorNo = 0;
  botonNo.addEventListener('click', () => {
    botonNo.textContent = frasesNo[contadorNo % frasesNo.length];
    contadorNo++;
    const x = Math.random() * 180 - 90;
    const y = Math.random() * 180 - 90;
    botonNo.style.transform = `translate(${x}px, ${y}px)`;
    
    // Alternar entre pop y murciélago
    if (Math.random() > 0.5) {
      reproducirAudio(sonidoMurcielago);
    } else {
      reproducirPop();
    }
  });

  function reproducirAudio(audio) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  }

  function reproducirPop() {
    sonidoPop.currentTime = 0;
    sonidoPop.play().catch(() => {
      const fallback = new Audio('pop-94319.mp3');
      fallback.volume = 0.4;
      fallback.play().catch(() => {});
    });
  }

  botonSi.addEventListener('click', () => {
    contenedorBotones.style.display = 'none';
    mensajeFinal.classList.add('show');
    
    // Scroll suave al mensaje
    setTimeout(() => {
      mensajeFinal.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
    
    lanzarConfetiHalloween();
    reproducirPop();
    musica.play().catch(() => {});

    const mensaje = "¡Acepto la cita de Halloween contigo! 🎃 Estoy lista para nuestro momento mágico y espeluznante... Te espero con el corazón latiendo fuerte 💓 ¡Nos vemos pronto, mi amor! 😘✨";
    const numero = "573187447485";
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
    window.location.href = url;
  });

  function lanzarConfetiHalloween() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const simbolos = ['🎃', '🦇', '👻', '🕷️', '💀'];
    const confeti = [];
    for (let i = 0; i < 100; i++) {
      confeti.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 20 + 15,
        symbol: simbolos[Math.floor(Math.random() * simbolos.length)],
        speed: Math.random() * 3 + 1,
        rotation: Math.random() * 360,
        color: Math.random() > 0.5 ? '#ff6b35' : '#b721ff'
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confeti.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.font = `bold ${p.size}px Arial`;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fillText(p.symbol, 0, 0);
        ctx.restore();
      });
      update();
    }

    function update() {
      confeti.forEach(p => {
        p.y += p.speed;
        p.rotation += 2;
        if (p.y > canvas.height) {
          p.y = -30;
          p.x = Math.random() * canvas.width;
        }
      });
    }

    const interval = setInterval(draw, 50);
    setTimeout(() => clearInterval(interval), 5000);
  }

  function crearMurcielago() {
    const murcielago = document.createElement('div');
    murcielago.classList.add('bat');
    murcielago.textContent = "🦇";
    murcielago.style.left = Math.random() * 100 + "vw";
    murcielago.style.fontSize = (18 + Math.random() * 12) + "px";
    murcielago.style.animationDuration = (6 + Math.random() * 4) + "s";
    document.body.appendChild(murcielago);
    setTimeout(() => {
      murcielago.style.transition = "opacity 1s";
      murcielago.style.opacity = "0";
      setTimeout(() => murcielago.remove(), 1000);
    }, 7000);
  }
</script>
</body>
</html>
